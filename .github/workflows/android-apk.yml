name: Build Android APK (Doula Agro)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    name: Vérification TypeScript & Tests Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest test suites
        run: npm test

  build-apk:
    name: Build & Publish Android APK (GitHub Releases)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21 (Temurin — requis par Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Android APK (base=./)
        env:
          VITE_SUPABASE_URL: "https://krmvdahejfczrziobesi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_9GTs8V5G33NYHqEQUPoHzA_Nd4xHgRq"
        run: npm run build:mobile

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare doula-agro.apk for release
        run: |
          cp android/app/build/outputs/apk/debug/doula-agro-debug.apk doula-agro.apk
          ls -lh doula-agro.apk

      - name: Upload doula-agro.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: doula-agro-debug.apk
          path: doula-agro.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish doula-agro.apk to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Doula Agro — Dernière version Android (APK)
          body: |
            Téléchargement direct de la dernière version Android de **Doula Agro** (build automatique sur `${{ github.sha }}`).

            **Installation :**
            1. Téléchargez **`doula-agro.apk`** sur votre téléphone Android.
            2. Ouvrez le fichier et autorisez l'installation depuis des sources inconnues si demandé.
            3. Dans **Paramètres / Rappels**, activez les **Autorisations Notifications Critiques** pour recevoir les alertes même en veille ou en mode Silence.
          files: doula-agro.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
