name: Doula Agro CI — Typecheck, Phyto Tests, Build & Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest phytosanitary & business-rule test suites
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E (Mobile 360×800, FR/AR RTL & User Flows)
        run: npm run test:e2e
