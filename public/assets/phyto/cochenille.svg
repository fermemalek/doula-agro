<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Tronc et branche recouverts du manchon feutré blanc de la cochenille -->
  <g transform="translate(110, 30)">
    <!-- Écorce de bois brun -->
    <path d="M 80 210 Q 75 110 80 20" stroke="#78350f" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 80 210 Q 75 110 80 20" stroke="#451a03" stroke-width="18" fill="none" stroke-linecap="round"/>

    <!-- Boucliers cireux et amas cotonneux blanchâtres (Cochenille blanche) -->
    <!-- Amas central dense -->
    <ellipse cx="80" cy="110" rx="22" ry="32" fill="#f8fafc" fill-opacity="0.95"/>
    <ellipse cx="74" cy="90" rx="14" ry="18" fill="#e2e8f0"/>
    <ellipse cx="85" cy="130" rx="16" ry="20" fill="#f1f5f9"/>

    <!-- Boucliers individuels disséminés -->
    <circle cx="82" cy="50" r="5" fill="#f8fafc"/>
    <circle cx="76" cy="62" r="6" fill="#f8fafc"/>
    <circle cx="85" cy="72" r="5.5" fill="#f1f5f9"/>
    <circle cx="78" cy="165" r="7" fill="#f8fafc"/>
    <circle cx="84" cy="180" r="6" fill="#f1f5f9"/>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Cochenilles (الحشرة القشرية)</text>
  <text x="35" y="273" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Pseudaulacaspis / Saissetia • Manchons cireux feutrés recouvrant le bois</text>
</svg>
