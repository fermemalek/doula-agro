<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19261a"/>
      <stop offset="100%" stop-color="#0a120b"/>
    </linearGradient>
    <linearGradient id="oliveLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="50%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Feuille d'olivier allongée typique -->
  <g transform="translate(60, 40) rotate(15)">
    <!-- Limbe vert-argenté -->
    <path d="M 0 100 C 60 10, 180 20, 260 90 C 180 150, 60 160, 0 100 Z" fill="url(#oliveLeaf)"/>
    <path d="M 0 100 Q 130 92 260 90" stroke="#bef264" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Tache Oeil de paon (Ocelle concentrique caractéristique) -->
    <!-- Halo jaune externe -->
    <ellipse cx="140" cy="85" rx="34" ry="30" fill="#eab308" opacity="0.95"/>
    <!-- Anneau foncé intermédiaire -->
    <ellipse cx="140" cy="85" rx="24" ry="21" fill="#422006"/>
    <!-- Zone claire interne -->
    <ellipse cx="140" cy="85" rx="16" ry="14" fill="#a16207"/>
    <!-- Point noir central (pupille de l'oeil de paon) -->
    <ellipse cx="140" cy="85" rx="9" ry="8" fill="#18181b"/>

    <!-- Seconde tache plus petite -->
    <ellipse cx="75" cy="98" rx="20" ry="18" fill="#eab308" opacity="0.9"/>
    <ellipse cx="75" cy="98" rx="13" ry="11" fill="#422006"/>
    <ellipse cx="75" cy="98" rx="5" ry="4" fill="#18181b"/>

    <!-- Troisième tache débutante -->
    <ellipse cx="195" cy="78" rx="16" ry="14" fill="#ca8a04" opacity="0.85"/>
    <ellipse cx="195" cy="78" rx="8" ry="7" fill="#422006"/>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Œil de paon de l'olivier (عين الطاووس)</text>
  <text x="35" y="273" fill="#fde047" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Venturia oleaginea • Taches circulaires foncées bordées d'un halo jaune</text>
</svg>