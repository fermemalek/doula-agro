<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="youngFruit" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="60%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Jeune nectarine avec argenture et marbrures liégeuses de thrips -->
  <g transform="translate(140, 45)">
    <circle cx="65" cy="80" r="65" fill="url(#youngFruit)"/>

    <!-- Marbrures liégeuses et argentures grisâtres superficielles (piqûres de thrips) -->
    <path d="M 30 75 Q 60 65 95 80 Q 75 105 45 95 Z" fill="#e2e8f0" fill-opacity="0.65" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 50 50 Q 80 40 100 60 Q 90 75 60 70 Z" fill="#e2e8f0" fill-opacity="0.65" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 40 100 Q 70 120 90 105 Q 80 90 50 95 Z" fill="#ca8a04" fill-opacity="0.5" stroke="#a16207" stroke-width="1.5"/>

    <!-- Insecte thrips minuscule (fusiforme noir/jaune aux ailes frangées) -->
    <g transform="translate(100, 45) rotate(45)">
      <ellipse cx="0" cy="0" rx="3" ry="12" fill="#18181b"/>
      <line x1="-6" y1="-4" x2="6" y2="4" stroke="#71717a" stroke-width="1"/>
      <line x1="-6" y1="2" x2="6" y2="10" stroke="#71717a" stroke-width="1"/>
    </g>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Thrips des fleurs &amp; fruits (التربس)</text>
  <text x="35" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Frankliniella / Thrips • Marbrures liégeuses, argentures &amp; déformations</text>
</svg>