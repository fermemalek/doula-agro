<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a14"/>
      <stop offset="100%" stop-color="#0d0805"/>
    </linearGradient>
    <radialGradient id="appleCut" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fef9c3"/>
      <stop offset="90%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Pomme coupée en deux montrant la galerie interne du carpocapse -->
  <g transform="translate(130, 40)">
    <!-- Moitié de pomme -->
    <path d="M 70 15 C 115 5, 155 35, 155 85 C 155 140, 115 170, 70 165 C 25 170, -15 140, -15 85 C -15 35, 25 5, 70 15 Z" fill="url(#appleCut)" stroke="#b91c1c" stroke-width="4"/>

    <!-- Pépins au centre -->
    <ellipse cx="60" cy="95" rx="5" ry="9" fill="#451a03" transform="rotate(-15, 60, 95)"/>
    <ellipse cx="78" cy="95" rx="5" ry="9" fill="#451a03" transform="rotate(15, 78, 95)"/>

    <!-- Galerie creusée par la larve depuis l'extérieur jusqu'aux pépins -->
    <path d="M 152 75 Q 120 70 100 85 Q 85 95 72 96" stroke="#78350f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 152 75 Q 120 70 100 85 Q 85 95 72 96" stroke="#451a03" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Orifice d'entrée avec sciure et déjections granuleuses brunes expulsées -->
    <ellipse cx="152" cy="75" rx="8" ry="12" fill="#78350f" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="156" cy="68" r="2.5" fill="#451a03"/>
    <circle cx="160" cy="74" r="3" fill="#451a03"/>
    <circle cx="158" cy="82" r="2.5" fill="#451a03"/>
    <circle cx="163" cy="78" r="2" fill="#78350f"/>

    <!-- Chenille rose/blanche à tête brune (larve du carpocapse) -->
    <g transform="translate(95, 78) rotate(35)">
      <rect x="0" y="0" width="22" height="7" rx="3.5" fill="#fbcfe8" stroke="#f472b6" stroke-width="1"/>
      <circle cx="21" cy="3.5" r="3" fill="#78350f"/>
    </g>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Carpocapse des pommes (دود ثمار التفاح)</text>
  <text x="35" y="273" fill="#fdba74" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Cydia pomonella • Galerie creusée jusqu'aux pépins avec sciure brune expulsée</text>
</svg>