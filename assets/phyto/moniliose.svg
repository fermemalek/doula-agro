<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1812"/>
      <stop offset="100%" stop-color="#0d0906"/>
    </linearGradient>
    <radialGradient id="peachFruit" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="rotZone" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#270d03"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Fruit de pêche/nectarine attaqué par la moniliose -->
  <g transform="translate(130, 40)">
    <!-- Pêche saine partiellement -->
    <path d="M 70 20 C 110 5, 150 40, 150 90 C 150 145, 110 175, 70 170 C 30 175, -10 145, -10 90 C -10 40, 30 5, 70 20 Z" fill="url(#peachFruit)"/>

    <!-- Tache de pourriture brune en expansion -->
    <ellipse cx="85" cy="100" rx="60" ry="55" fill="url(#rotZone)"/>

    <!-- Anneaux concentriques caractéristiques de coussinets de spores beige-crème (Monilinia) -->
    <!-- Anneau 1 (centre) -->
    <circle cx="85" cy="100" r="5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    
    <!-- Anneau 2 -->
    <circle cx="75" cy="90" r="4" fill="#fef3c7"/>
    <circle cx="95" cy="90" r="4" fill="#fef3c7"/>
    <circle cx="95" cy="110" r="4" fill="#fef3c7"/>
    <circle cx="75" cy="110" r="4" fill="#fef3c7"/>

    <!-- Anneau 3 -->
    <circle cx="65" cy="78" r="4.5" fill="#fef3c7"/>
    <circle cx="85" cy="74" r="4.5" fill="#fef3c7"/>
    <circle cx="105" cy="78" r="4.5" fill="#fef3c7"/>
    <circle cx="118" cy="98" r="4.5" fill="#fef3c7"/>
    <circle cx="112" cy="120" r="4.5" fill="#fef3c7"/>
    <circle cx="85" cy="128" r="4.5" fill="#fef3c7"/>
    <circle cx="58" cy="118" r="4.5" fill="#fef3c7"/>
    <circle cx="54" cy="98" r="4.5" fill="#fef3c7"/>

    <!-- Anneau 4 extérieur -->
    <circle cx="50" cy="65" r="5" fill="#fef3c7"/>
    <circle cx="85" cy="55" r="5" fill="#fef3c7"/>
    <circle cx="120" cy="65" r="5" fill="#fef3c7"/>
    <circle cx="138" cy="100" r="5" fill="#fef3c7"/>
    <circle cx="130" cy="135" r="5" fill="#fef3c7"/>
    <circle cx="85" cy="148" r="5" fill="#fef3c7"/>
    <circle cx="40" cy="135" r="5" fill="#fef3c7"/>
    <circle cx="34" cy="100" r="5" fill="#fef3c7"/>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Moniliose des fruits (العفن البني للثمار)</text>
  <text x="35" y="273" fill="#fde68a" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Monilinia spp. • Cercles concentriques de coussinets de spores beiges</text>
</svg>