<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142419"/>
      <stop offset="100%" stop-color="#080f0a"/>
    </linearGradient>
    <linearGradient id="leafCurl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Feuille recroquevillée et crispée en cigare abritant une colonie de pucerons -->
  <g transform="translate(80, 40)">
    <!-- Enroulement sévère du limbe -->
    <path d="M 20 140 C 40 40, 150 10, 220 50 C 190 120, 160 170, 70 160 C 20 155, 10 145, 20 140 Z" fill="url(#leafCurl)"/>
    <path d="M 60 130 C 100 80, 160 70, 200 90 C 170 140, 120 150, 60 130 Z" fill="#14532d"/>

    <!-- Pucerons cendrés / verts regroupés sous la face inférieure -->
    <!-- Puceron 1 -->
    <ellipse cx="110" cy="115" rx="7" ry="9" fill="#15803d" stroke="#14532d" stroke-width="1.5"/>
    <!-- Puceron 2 -->
    <ellipse cx="125" cy="110" rx="6" ry="8" fill="#16a34a"/>
    <!-- Puceron 3 -->
    <ellipse cx="98" cy="120" rx="6" ry="7.5" fill="#4ade80"/>
    <!-- Puceron 4 -->
    <ellipse cx="140" cy="105" rx="7" ry="9" fill="#84cc16"/>
    <!-- Puceron 5 -->
    <ellipse cx="120" cy="128" rx="6" ry="7" fill="#15803d"/>
    <!-- Puceron 6 (cendré) -->
    <ellipse cx="150" cy="120" rx="6" ry="8" fill="#71717a"/>
    <ellipse cx="135" cy="125" rx="5.5" ry="7" fill="#a1a1aa"/>

    <!-- Gouttelettes de miellat luisant et fumagine -->
    <circle cx="105" cy="95" r="3.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="130" cy="90" r="3" fill="#fef08a" opacity="0.9"/>
    <circle cx="160" cy="100" r="4" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Pucerons (المن الأخضر / الرمادي)</text>
  <text x="35" y="273" fill="#86efac" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Dysaphis / Myzus • Crispation sévère des feuilles &amp; miellat abondant</text>
</svg>
