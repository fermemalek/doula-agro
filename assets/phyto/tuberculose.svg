<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="gall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="40%" stop-color="#78716c"/>
      <stop offset="85%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Rameau d'olivier avec tumeurs et galles ligneuses (Tuberculose / Gale) -->
  <g transform="translate(100, 30)">
    <!-- Rameau ligneux -->
    <path d="M 100 210 Q 95 120 100 20" stroke="#78350f" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 100 210 Q 95 120 100 20" stroke="#451a03" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Tumeurs rugueuses (Galles / Knots de tuberculose) -->
    <!-- Grande tumeur au nœud central -->
    <g transform="translate(100, 115)">
      <ellipse cx="0" cy="0" rx="38" ry="32" fill="url(#gall)"/>
      <ellipse cx="-12" cy="-8" rx="14" ry="12" fill="#57534e"/>
      <ellipse cx="14" cy="6" rx="16" ry="14" fill="#292524"/>
      <ellipse cx="2" cy="12" rx="12" ry="10" fill="#78716c"/>
      <!-- Crevasses rugueuses de l'écorce tumorale -->
      <path d="M -25 -5 Q 0 10 25 -5 M -15 15 Q 5 20 20 8 M -20 -15 Q 0 -5 18 -18" stroke="#1c1917" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Seconde tumeur sur blessure supérieure -->
    <g transform="translate(102, 55)">
      <ellipse cx="0" cy="0" rx="24" ry="20" fill="url(#gall)"/>
      <ellipse cx="-6" cy="-4" rx="10" ry="8" fill="#57534e"/>
      <path d="M -15 0 Q 0 5 15 0" stroke="#1c1917" stroke-width="2" fill="none"/>
    </g>

    <!-- Troisième petite galle naissante -->
    <g transform="translate(97, 175)">
      <ellipse cx="0" cy="0" rx="18" ry="15" fill="url(#gall)"/>
    </g>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Tuberculose de l'olivier (سل الزيتون / الجرب)</text>
  <text x="35" y="273" fill="#d6d3d1" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Pseudomonas savastanoi • Tumeurs ligneuses et galles verruqueuses sur rameaux</text>
</svg>
