<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#0d0905"/>
    </linearGradient>
    <radialGradient id="peachFruit" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Fruit de pêche/nectarine mûr avec piqûre de cératite -->
  <g transform="translate(130, 40)">
    <circle cx="70" cy="85" r="70" fill="url(#peachFruit)"/>

    <!-- Piqûre de ponte de la Cératite -->
    <g transform="translate(85, 75)">
      <!-- Zone translucide ramollie autour du point de ponte -->
      <circle cx="0" cy="0" r="22" fill="#78350f" opacity="0.6"/>
      <circle cx="0" cy="0" r="14" fill="#451a03" opacity="0.85"/>
      <circle cx="0" cy="0" r="4.5" fill="#18181b"/>
      <!-- Gouttelette de sève translucide exsudée -->
      <circle cx="3" cy="-3" r="2" fill="#fef08a" opacity="0.9"/>
    </g>

    <!-- Mouche méditerranéenne adulte posée (dessin simplifié caractéristique avec ailes tachées de jaune/noir) -->
    <g transform="translate(40, 20) scale(0.7) rotate(-20)">
      <!-- Corps de la mouche -->
      <ellipse cx="20" cy="20" rx="9" ry="14" fill="#ca8a04"/>
      <circle cx="20" cy="6" r="6" fill="#78350f"/>
      <circle cx="16" cy="4" r="3" fill="#dc2626"/>
      <circle cx="24" cy="4" r="3" fill="#dc2626"/>
      <!-- Ailes transparentes marbrées -->
      <ellipse cx="5" cy="25" rx="8" ry="18" fill="#ffffff" fill-opacity="0.6" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-35, 5, 25)"/>
      <ellipse cx="35" cy="25" rx="8" ry="18" fill="#ffffff" fill-opacity="0.6" stroke="#ca8a04" stroke-width="1.5" transform="rotate(35, 35, 25)"/>
    </g>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Mouche des fruits / Cératite (ذبابة الفاكهة)</text>
  <text x="35" y="273" fill="#fdba74" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Ceratitis capitata • Piqûre de ponte entourée d'une tache molle translucide</text>
</svg>