<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142419"/>
      <stop offset="100%" stop-color="#080f0a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Inflorescence d'olivier recouverte de sécrétion cotonneuse blanche (coton du psylle) -->
  <g transform="translate(110, 40)">
    <!-- Rameau d'olivier -->
    <path d="M 40 180 Q 90 120 120 40" stroke="#65a30d" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Grappe florale -->
    <circle cx="85" cy="115" r="5" fill="#fef08a"/>
    <circle cx="100" cy="100" r="5" fill="#fef08a"/>
    <circle cx="105" cy="80" r="5" fill="#fef08a"/>

    <!-- Manchon de cire cotonneuse blanche enveloppant la floraison -->
    <ellipse cx="95" cy="98" rx="42" ry="34" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1.5"/>
    <ellipse cx="75" cy="110" rx="25" ry="22" fill="#ffffff" fill-opacity="0.92"/>
    <ellipse cx="115" cy="85" rx="26" ry="24" fill="#ffffff" fill-opacity="0.92"/>
    <ellipse cx="100" cy="120" rx="30" ry="20" fill="#f8fafc" fill-opacity="0.95"/>

    <!-- Filaments de cire externes -->
    <path d="M 60 115 Q 45 125 40 135 M 125 75 Q 140 70 150 65 M 110 130 Q 120 145 125 155" 
          stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Légende clinique -->
  <rect x="20" y="235" width="360" height="48" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
  <text x="35" y="256" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="bold">Psylle de l'olivier (صوف / قطن الزيتون)</text>
  <text x="35" y="273" fill="#f1f5f9" font-size="11" font-family="system-ui, sans-serif" font-style="italic">Euphyllura olivina • Filaments de cire cotonneuse blanche englobant les fleurs</text>
</svg>
